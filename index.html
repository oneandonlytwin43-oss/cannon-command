<!doctype html><html><head><meta charset="utf-8"><title>CANNON COMMAND // PAPER</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--g:#00ff41;--m:#008f11;--d:#003b00;--r:#a04040}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--g);font:12px/1.35 "Courier New",ui-monospace,monospace}
#rain{position:fixed;inset:0;opacity:.09;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;padding:8px;display:grid;gap:8px}
.glow{text-shadow:0 0 6px rgba(0,255,65,.6)}
.box{border:1px solid var(--m);background:rgba(0,10,0,.85);box-shadow:0 0 10px rgba(0,255,65,.15) inset,0 0 6px rgba(0,255,65,.15);padding:6px;overflow:hidden}
.box h3{margin:0 0 4px;font-size:11px;color:var(--m);letter-spacing:2px;border-bottom:1px dashed var(--d)}
header{display:flex;align-items:center;gap:16px}
.logo{font-size:26px;font-weight:bold;letter-spacing:4px}
.badge{border:1px solid var(--g);padding:2px 8px;animation:bl 1.5s infinite;font-weight:bold}
@keyframes bl{50%{opacity:.45}}
#clock{margin-left:auto;font-size:22px}
.tape{white-space:nowrap;overflow:hidden;border-top:1px solid var(--d);border-bottom:1px solid var(--d)}
.tape span{display:inline-block;padding-left:100%;animation:sc 40s linear infinite}@keyframes sc{to{transform:translateX(-100%)}}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat .v{font-size:20px}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.card{cursor:pointer;min-height:110px}.card:hover,.card.sel{border-color:var(--g);box-shadow:0 0 14px rgba(0,255,65,.5)}
.card img{width:22px;height:22px;border-radius:50%;vertical-align:middle;filter:grayscale(1) sepia(1) hue-rotate(70deg) saturate(4)}
.card canvas{width:100%;height:36px}
.main{display:grid;grid-template-columns:1fr 380px;gap:8px}
#chart{height:400px}
table{width:100%;border-collapse:collapse}td,th{padding:2px 4px;text-align:left;white-space:nowrap}th{color:var(--m);font-weight:normal}
tr.click{cursor:pointer}tr.click:hover{background:var(--d)}
.up{color:var(--g);font-weight:bold}.dn{color:var(--m)}.loss{color:var(--r)}.dim{color:var(--m)}
.scroll{max-height:300px;overflow:auto}.low{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
pre{white-space:pre-wrap;margin:0;color:var(--m);max-height:300px;overflow:auto}
.rocket{text-align:center;font-size:11px}.rocket .r{font-size:30px;display:inline-block;animation:fl 2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--d)}
</style></head><body><canvas id="rain"></canvas><div class="wrap">
<header class="box"><div class="logo glow">▣ CANNON COMMAND</div><div class="badge glow">PAPER / PLAY MONEY</div><div class="dim">read-only · no keys · no trading</div><button id="snd" onclick="togSnd()" style="background:#000;color:#00ff41;border:1px solid #008f11;font:inherit;cursor:pointer;padding:3px 8px">🔇 CLICK TO ENABLE SOUND</button><div id="clock" class="glow"></div></header>
<div class="tape box"><span id="tape">loading tickers…</span></div>
<div class="stats" id="stats"></div>
<div class="cards" id="cards"></div>
<div class="main"><div class="box"><h3 id="ctitle">CHART</h3><div id="chart"></div></div>
<div class="box"><h3>WATCHLIST // CALLOUT PICKS (seen.json)</h3><div class="scroll" style="max-height:400px"><table id="picks"></table></div></div></div>
<div class="low"><div class="box"><h3>HOLDINGS</h3><div class="scroll"><table id="hold"></table></div><h3 style="margin-top:8px">RECENT EVENTS (callout_trades.jsonl)</h3><div class="scroll"><table id="ev"></table></div></div>
<div class="box"><h3>SCAN // GECKOTERMINAL TRENDING + PUMPSWAP</h3><div class="scroll" style="max-height:620px"><table id="trend"></table></div></div>
<div class="box"><h3 id="scanname">LATEST SCAN</h3><pre id="scan"></pre></div></div>
<div class="dim" id="foot"></div></div>
<script>const DATA='https://raw.githubusercontent.com/oneandonlytwin43-oss/cannon-command/data/state.json';
const $=id=>document.getElementById(id);let S=null,sel=null,chart,cs,vs;
const f=(x,d=4)=>x==null||isNaN(x)?'—':(+x).toFixed(d);
const usd=x=>x==null?'—':(+x>=1e6?'$'+(x/1e6).toFixed(2)+'M':+x>=1e3?'$'+(x/1e3).toFixed(1)+'K':+x>=1?'$'+(+x).toFixed(2):'$'+(+x).toPrecision(4));
const pc=x=>x==null||isNaN(x)?'<span class=dim>—</span>':(+x>=0?`<span class=up>▲ ${(+x).toFixed(2)}%</span>`:`<span class=loss>▼ ${(+x).toFixed(2)}%</span>`);
const sh=m=>m?m.slice(0,4)+'…'+m.slice(-4):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('en-US',{hour12:false,timeZone:'America/New_York'})+' ET',1000);
// rain
(()=>{const c=$('rain'),x=c.getContext('2d');let w,h,d;const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;d=Array(Math.ceil(w/14)).fill(0).map(()=>Math.random()*h/14)};rs();onresize=rs;
setInterval(()=>{x.fillStyle='rgba(0,0,0,.08)';x.fillRect(0,0,w,h);x.fillStyle='#00ff41';x.font='13px monospace';d.forEach((y,i)=>{x.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*14,y*14);d[i]=y*14>h&&Math.random()>.975?0:y+1})},70)})();
function initChart(){chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#000'},textColor:'#00ff41',fontFamily:'Courier New'},grid:{vertLines:{color:'#002200'},horzLines:{color:'#002200'}},timeScale:{timeVisible:true,borderColor:'#008f11'},rightPriceScale:{borderColor:'#008f11'},localization:{priceFormatter:p=>p.toPrecision(4)}});
cs=chart.addCandlestickSeries({upColor:'#00ff41',downColor:'#000',borderUpColor:'#00ff41',borderDownColor:'#008f11',wickUpColor:'#00ff41',wickDownColor:'#008f11'});
vs=chart.addHistogramSeries({priceScaleId:'v',priceFormat:{type:'volume'},color:'#005f0b'});chart.priceScale('v').applyOptions({scaleMargins:{top:.8,bottom:0}});
new ResizeObserver(()=>chart.applyOptions({width:$('chart').clientWidth,height:400})).observe($('chart'))}
async function select(pool,label,mint){if(!pool)return;sel={pool,label,mint};$('ctitle').textContent='CHART // '+label+' // 5m candles (GeckoTerminal) · pool '+sh(pool);
document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.pool==pool));
try{const r=await (await fetch('https://api.geckoterminal.com/api/v2/networks/solana/pools/'+pool+'/ohlcv/minute?aggregate=5&limit=200')).json();const l=(r.data?.attributes?.ohlcv_list||[]).slice().reverse();if(!l.length)throw 0;
if(!chart)initChart();cs.setData(l.map(a=>({time:a[0],open:a[1],high:a[2],low:a[3],close:a[4]})));vs.setData(l.map(a=>({time:a[0],value:a[5],color:a[4]>=a[1]?'#00a82d':'#003b00'})));chart.timeScale().fitContent()}
catch(e){if(chart){chart.remove();chart=null}$('chart').innerHTML=`<iframe style="width:100%;height:400px;border:0" src="https://dexscreener.com/solana/${pool}?embed=1&theme=dark&info=0"></iframe>`}}
function spark(cv,up){const x=cv.getContext('2d');cv.width=160;cv.height=36;x.strokeStyle=up?'#00ff41':'#008f11';x.shadowColor='#00ff41';x.shadowBlur=4;x.beginPath();let v=18;for(let i=0;i<=40;i++){}x.moveTo(0,30);x.lineTo(160,up?6:30);x.stroke()}
function render(s){S=s;const t=s.tickers||{},tk=[['BTC','bitcoin'],['ETH','ethereum'],['SOL','solana']].map(([a,b])=>`${a} ${usd(t[b]?.usd)} ${pc(t[b]?.usd_24h_change)}`).join('   ◆   ');
$('tape').innerHTML=(tk+'   ◆   '+s.holdings.map(h=>`${esc(h.sym)} ${pc(h.upnl_pct)}`).join('   ◆   ')+'   ◆   ').repeat(2);
const pl=s.pnl_sol;$('stats').innerHTML=[['FREE CASH',f(s.cash)+' SOL'],['HOLDINGS (live)',f(s.holdings_value)+' SOL'],['TOTAL EQUITY',f(s.equity)+' SOL'],['vs START '+s.start,`<span class=${pl>=0?'up':'loss'}>${pl>=0?'▲ +':'▼ '}${f(pl)} SOL (${f(s.pnl_pct,2)}%)</span>`],['EQUITY USD',s.sol_usd?usd(s.equity*s.sol_usd):'—'],['REALIZED / FILLS',f(s.realized)+' SOL / '+(s.n_trades??'—')]].map(([k,v])=>`<div class="box stat"><h3>${k}</h3><div class="v glow">${v}</div></div>`).join('');
// six monitor cards: holdings first then top trending
const cards=s.holdings.map(h=>({k:'HOLD',sym:h.sym,pool:h.pair,mint:h.mint,p:h.price_usd,c:h.upnl_pct,sub:'uPnL '+f(h.upnl_sol)+' SOL'})).concat(s.trending.map(p=>({k:'TREND',sym:p.name,pool:p.pool,mint:p.mint,p:p.price,c:p.chg_h24,sub:'vol24 '+usd(p.vol_h24)}))).slice(0,5);
$('cards').innerHTML=cards.map(c=>`<div class="box card" data-pool="${c.pool}" onclick="select('${c.pool}','${esc(c.sym).replace(/'/g,'')}','${c.mint}')"><h3>${c.k} ▸ ${esc(c.sym).slice(0,18)}</h3><img src="https://dd.dexscreener.com/ds-data/tokens/solana/${c.mint}.png" onerror="this.style.display='none'"> <span class="glow" style="font-size:15px">${usd(c.p)}</span><br>${pc(c.c)}<canvas data-up="${(c.c||0)>=0?1:0}"></canvas><div class=dim>${c.sub}</div></div>`).join('')+
`<div class="box rocket"><h3>TO THE MOON</h3><div class="r glow">🚀</div><div>${pl>=0?'▲ ASCENDING':'▼ ON THE PAD'}</div><div class=dim>${f(s.pnl_pct,2)}% vs start</div></div>`;
document.querySelectorAll('.card canvas').forEach(cv=>spark(cv,cv.dataset.up=='1'));
if(sel)document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.pool==sel.pool));
$('hold').innerHTML='<tr><th>SYM</th><th>SRC</th><th>COST</th><th>VALUE</th><th>uPnL</th><th>1h</th></tr>'+s.holdings.map(h=>`<tr class=click onclick="select('${h.pair}','${esc(h.sym)}','${h.mint}')"><td class=glow>${esc(h.sym)}</td><td class=dim>${h.src||'callout'}</td><td>${f(h.cost)}</td><td>${f(h.value_sol)}${h.live?'':' <span class=dim>(stale)</span>'}</td><td>${pc(h.upnl_pct)}</td><td>${pc(h.chg_h1)}</td></tr>`).join('');
$('ev').innerHTML=s.events.filter(e=>['BUY','SELL','NEW_CALLOUT'].includes(e.ev)).map(e=>`<tr><td class=dim>${(e.ts||'').slice(5,16).replace('T',' ')}</td><td class=${e.ev=='BUY'?'up':e.ev=='SELL'?'glow':'dim'}>${e.ev=='BUY'?'▲ BUY':e.ev=='SELL'?'▼ SELL':'◆ CALL'}</td><td>${esc(e.sym)}</td><td>${e.size_sol!=null?f(e.size_sol)+' SOL':e.proceeds!=null?f(e.proceeds)+' SOL':esc(e.scan||e.src||'')}</td></tr>`).join('');
$('picks').innerHTML='<tr><th>SYM</th><th>REPORTED</th><th>PRICE</th><th>24h</th></tr>'+s.picks.map(p=>`<tr class=click onclick="select('${p.pair||''}','${esc(p.symbol)}','${p.mint}')"><td class=glow>${esc(p.symbol)}</td><td class=dim>${esc(p.reported)}</td><td>${usd(p.price_usd)}</td><td>${pc(p.chg_h24)}</td></tr>`).join('');
const tr=(n,a)=>`<tr><th colspan=5>— ${n} —</th></tr><tr><th>POOL</th><th>PRICE</th><th>1h</th><th>24h</th><th>LIQ</th></tr>`+a.map(p=>`<tr class=click onclick="select('${p.pool}','${esc(p.name).replace(/'/g,'')}','${p.mint}')"><td>${esc(p.name).slice(0,20)}</td><td>${usd(p.price)}</td><td>${pc(p.chg_h1)}</td><td>${pc(p.chg_h24)}</td><td>${usd(p.liq)}</td></tr>`).join('');
$('trend').innerHTML=tr('TRENDING',s.trending)+tr('PUMPSWAP',s.pumpswap);
$('scanname').textContent='LATEST SCAN // '+(s.latest_scan.name||'none');$('scan').textContent=s.latest_scan.text;
$('foot').textContent='updated '+s.ts+' · prices: DexScreener / GeckoTerminal / CoinGecko (cached 20-30s) · PAPER / PLAY MONEY — not real funds';
if(!sel){const h=s.holdings.find(h=>h.pair);if(h)select(h.pair,h.sym,h.mint)}}

let AC=null,sndOn=false,seenEv=null;
function togSnd(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();sndOn=!sndOn;$('snd').textContent=sndOn?'🔊 SOUND ON (click to mute)':'🔇 MUTED (click to unmute)';if(sndOn)chime('trade')}
function chime(kind){if(!sndOn||!AC)return;const n=kind=='pick'?[880,1175,1568]:kind=='approval'?[660,660,990]:[523,392];let t=AC.currentTime;
n.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind=='pick'?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.13);g.gain.linearRampToValueAtTime(.25,t+i*.13+.01);g.gain.exponentialRampToValueAtTime(.001,t+i*.13+.35);o.connect(g).connect(AC.destination);o.start(t+i*.13);o.stop(t+i*.13+.4)})}
function alerts(s){const items=s.events.filter(e=>['BUY','SELL','NEW_CALLOUT'].includes(e.ev)).map(e=>[e.ev+'|'+e.ts+'|'+(e.mint||''),e.ev=='NEW_CALLOUT'?'pick':'trade']).concat((s.pending||[]).map(p=>['PEND|'+JSON.stringify(p),'approval']));
if(seenEv===null){seenEv=new Set(items.map(i=>i[0]));return}const nk=new Set();items.forEach(([k,kind])=>{if(!seenEv.has(k)){seenEv.add(k);nk.add(kind)}});
['pick','trade','approval'].forEach((k,i)=>nk.has(k)&&setTimeout(()=>chime(k),i*700))}
async function poll(){try{const s=await (await fetch(DATA+'?t='+Date.now(),{cache:'no-store'})).json();render(s);alerts(s)}catch(e){$('foot').textContent='update failed: '+e}}
poll();setInterval(poll,8000);setInterval(()=>sel&&select(sel.pool,sel.label,sel.mint),60000);
</script></body></html>
